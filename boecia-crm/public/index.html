<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Boecia Talent CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23d99a1e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="app.js"></script>
</head>
<body class="signed-out">
<section class="signin" id="signin">
  <div class="signin-card">
    <div class="brand"><span class="dot"></span>Boecia Talent CRM</div>
    <p>Sign in with the Google account that has access to the CRM sheet.</p>
    <button class="btn primary" id="signin-btn" type="button">Sign in with Google</button>
    <p class="signin-error" id="signin-error" hidden></p>
    <button class="linkish" id="switch-account" type="button" hidden>Use a different account</button>
  </div>
</section>

<div class="reconnect" id="reconnect" hidden>
  <span>Your Google session expired.</span>
  <button class="btn primary" id="reconnect-btn" type="button">Reconnect</button>
</div>

<header>
  <div class="brand"><span class="dot"></span>Boecia Talent CRM</div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="controls">
    <input type="search" id="search" placeholder="Search…" aria-label="Search">
    <select id="owner" aria-label="Filter by owner"></select>
    <div class="seg" role="group" aria-label="View">
      <button id="view-board" aria-pressed="true">Board</button>
      <button id="view-table" aria-pressed="false">Table</button>
    </div>
    <button class="btn" id="refresh" title="Refresh">↻</button>
    <a class="btn" id="open-sheet" target="_blank" rel="noopener">Sheet ↗</a>
    <button class="btn primary" id="add">+ Add</button>
    <button class="btn" id="account" title="Sign out">Sign out</button>
  </div>
</header>

<main id="main"><div class="loading">Loading…</div></main>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="head">
    <h2 id="drawer-title"></h2>
    <button class="x" id="drawer-close" aria-label="Close">×</button>
  </div>
  <form id="drawer-form" autocomplete="off"></form>
  <div class="actions">
    <button class="btn danger" id="delete" type="button">Delete</button>
    <span class="spacer"></span>
    <button class="btn" id="cancel" type="button">Cancel</button>
    <button class="btn primary" id="save" type="button">Save</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

</body>
</html>
